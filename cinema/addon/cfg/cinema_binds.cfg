// cinema_dev keypad. Binds persist in the user's key config: exec cinema_unbind before quitting.
exec cinema
bind KP_8 "incrementvar citadel_camera_override_x_offset -400 100 10"
bind KP_2 "incrementvar citadel_camera_override_x_offset -400 100 -10"
bind KP_6 "incrementvar citadel_camera_override_y_offset -150 150 5"
bind KP_4 "incrementvar citadel_camera_override_y_offset -150 150 -5"
bind KP_9 "incrementvar citadel_camera_override_z_offset -150 150 5"
bind KP_3 "incrementvar citadel_camera_override_z_offset -150 150 -5"
bind KP_PLUS "incrementvar citadel_camera_override_fov 50 150 -5"
bind KP_MINUS "incrementvar citadel_camera_override_fov 50 150 5"
bind KP_5 "toggle citadel_camera_overrides_enabled 1 0"
bind KP_0 "toggle citadel_camera_inspect_mode 0 1 2"
bind KP_DIVIDE "cin_slow"
bind KP_MULTIPLY "toggle r_drawpanorama 0 1"
bind KP_DECIMAL "cin_freezefx"
bind KP_ENTER "cin_demo_pause"
bind KP_7 "toggle citadel_bot_brain_disable_movement 1 0"
bind KP_1 "toggle citadel_hud_visible 0 1"
echo "cinema: keypad bound (8/2 dolly, 4/6 truck, 9/3 pedestal, +/- zoom, 5 tripod, 0 orbit/lock, / slow, * panorama, . freeze fx, enter demo pause, 7 bots, 1 HUD)"

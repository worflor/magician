// cinema_dev: the film kit's aliases. Dev only, never shipped with a mod.  exec cinema
// Needs sv_cheats 1 (the Hero Sandbox's own cfg sets it). Every alias starts with cin_.
echo "cinema: aliases loaded (cin_*); exec cinema_binds for the keypad"
sv_cheats 1

// clean frame (build 6864, proven): citadel_hud_visible 0 hides the HUD, the crosshair, a demo's playback bar and
// its GAME IS PAUSED banner; the cinema pak's unit_status_v2 override removes every overhead bar and name; the
// telemetry and camera-fade cvars take the frame-time corner text and the see-through near the lens away (the
// near distances alone left a dither on a hero 40-150 units off: the trailer's grab and curtsy; the near opacities
// at 1 end it, proven 2026-11-21).
// r_drawpanorama 0 also hides your own health bar and the HUD's world labels, but it hides the console too
// (the console is a panorama panel), so keep it for the last step before a take: cin_clean_full.
alias cin_clean "citadel_hud_visible 0; cl_hud_telemetry_frametime_show 0; cl_hud_telemetry_ping_show 0; cl_hud_telemetry_net_misdelivery_show 0; citadel_camera_fade_other_near_dist 0; citadel_camera_fade_viewed_near_dist 0; citadel_camera_fade_other_near_opacity 1; citadel_camera_fade_viewed_near_opacity 1"
alias cin_clean_full "cin_clean; r_drawpanorama 0"
alias cin_hud "r_drawpanorama 1; exec cinema_reset; echo cinema: HUD back"

// tripod: the third-person camera moved off the hero (offsets are along the view: x forward, y right, z up)
alias cin_cam_on "citadel_camera_overrides_enabled 1"
alias cin_cam_off "citadel_camera_overrides_enabled 0"
alias cin_cam_reset "citadel_camera_overrides_enabled 0; citadel_camera_override_x_offset -135; citadel_camera_override_y_offset -34; citadel_camera_override_z_offset 0; citadel_camera_override_fov 90; citadel_camera_override_pivot_z_offset 86"
alias cin_cam_front "cin_cam_on; citadel_camera_override_x_offset 100; citadel_camera_override_y_offset 0; citadel_camera_override_z_offset 0"
alias cin_cam_wide "cin_cam_on; citadel_camera_override_x_offset -400; citadel_camera_override_y_offset 0; citadel_camera_override_z_offset 40; citadel_camera_override_fov 60"
alias cin_cam_tele "cin_cam_on; citadel_camera_override_x_offset -400; citadel_camera_override_y_offset 0; citadel_camera_override_z_offset 0; citadel_camera_override_fov 50"

// orbit the camera round your own hero (1), or lock the camera and walk the hero through it (2)
alias cin_orbit "citadel_camera_inspect_mode 1"
alias cin_lockcam "citadel_camera_inspect_mode 2"
alias cin_freecam_off "citadel_camera_inspect_mode 0"

// time
alias cin_slow "toggle host_timescale 1 0.5 0.25 0.1"
alias cin_realtime "host_timescale 1"
alias cin_freezefx "toggle r_freezeparticles 1 0"

// staging: bots that hold still and never shoot, a hero that never dies
alias cin_bot_still "citadel_bot_brain_disable_movement 1; citadel_bot_brain_disable_attacks 1"
alias cin_bot_live "citadel_bot_brain_disable_movement 0; citadel_bot_brain_disable_attacks 0"
alias cin_god "god; notarget; citadel_ability_cooldown_max 2"

// demo playback
alias cin_demo_pause "demo_togglepause"
alias cin_demo_slow "toggle demo_timescale 1 0.5 0.25 0.1"

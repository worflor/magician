// Put back every archived setting the cinema kit touches (they persist in the user's config): Valve's defaults,
// build 6864. Run before quitting a session: exec cinema_reset (cin_hud runs it too).
citadel_hud_visible 1
r_drawpanorama 1
cl_hud_telemetry_frametime_show 1
cl_hud_telemetry_ping_show 1
cl_hud_telemetry_net_misdelivery_show 1
citadel_camera_fade_other_near_dist 20
citadel_camera_fade_viewed_near_dist 20
citadel_camera_overrides_enabled 0
citadel_camera_override_x_offset -135
citadel_camera_override_y_offset -34
citadel_camera_override_z_offset 0
citadel_camera_override_fov 90
citadel_camera_override_pivot_z_offset 86
citadel_camera_inspect_mode 0
host_timescale 1
host_framerate 0
demo_timescale 1
r_drawworld 1
r_drawskybox 1
r_freezeparticles 0
echo "cinema: settings reset"
